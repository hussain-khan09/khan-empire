<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px 40px;
            border-radius: 8px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 30px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin: 12px 0 30px;
            font-size: 14px;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 25px 20px;
            margin-bottom: 25px;
        }

        legend {
            font-size: 15px;
            font-weight: bold;
            padding: 0 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"] {
            width: 100%;
            height: 45px;
            padding: 10px 12px;
            border: 1px solid #bbb;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .gender {
            margin-top: 5px;
        }

        .gender label {
            font-weight: normal;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gender input {
            width: 16px;
            height: 16px;
        }

        .submit-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Voter Registration Form</h1>

        <p class="subtitle">
            Please enter your details carefully.
        </p>

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                >
            </div>

            <div class="form-group">
                <label for="parentname">
                    Father's / Mother's Name:
                </label>
                <input
                    type="text"
                    id="parentname"
                    name="parentname"
                    placeholder="Enter parent/guardian name"
                >
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                >
            </div>

            <div class="form-group">
                <label>Gender:</label>

                <div class="gender">
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </div>
            </div>

        </fieldset>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <div class="form-group">
                <label for="mobile">Mobile Number:</label>
                <input
                    type="tel"
                    id="
